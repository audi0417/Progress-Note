name: Deploy demo to GitHub Pages

# Builds the frontend in browser-only DEMO mode (Web Speech API + localStorage,
# no backend) and publishes it to GitHub Pages so the flow can be tried on a
# single device at https://audi0417.github.io/Progress-Note/
#
# One-time setup by the repo owner:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (and, if prompted, allow this branch to deploy to the github-pages environment).

on:
  push:
    branches:
      - claude/medical-notes-speech-to-text-ddasxa
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (demo mode, project-page base path)
        env:
          VITE_DEMO_MODE: 'true'
          VITE_BASE: /Progress-Note/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
